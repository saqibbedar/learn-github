[project]
site_name = "gitcraft"
version = "0.1.0"
site_description = "A practical, readable Git reference for everyday workflows and long-term mastery."
site_url = "https://saqibbedar.github.io/gitcraft/"
site_author = "Saqib Bedar"
docs_dir = "docs"
site_dir = "site"
repo_name = "gitcraft"
repo = "fontawesome/brands/github"
repo_url = "https://github.com/saqibbedar/gitcraft"
edit_uri = "edit/main/docs/"
copyright = "Gitcraft is a practical learning repository for Git workflows, maintained by <a href='https://saqibbedar.github.io' target='_blank' style='text-decoration: none; font-weight: bold;'>Saqib Bedar</a>."

extra_css = [
  "stylesheets/extra.css",
]

nav = [
    { "Home" = "index.md" },

    { "Guide" = [
        { "Getting Started" = [
            "get-started/git-vs-github.md",
            "get-started/installation.md",
            "get-started/configuration.md",
            "get-started/git-basic-commands.md",
            "get-started/update-origin.md",
        ] },
    ] },

    { "Reference" = [
        { "Core Git" = [
            "core-git/index.md",
            "core-git/working-tree-to-commit.md",
            "core-git/commits-and-history.md",
        ] },
        { "Branches" = [
            "branches/index.md",
            "branches/branch-model.md",
            "branches/create-and-switch.md",
            "branches/compare.md",
            "branches/merge.md",
            "branches/rebase-and-sync.md",
            "branches/delete-and-restore.md",
            "branches/archive-on-backup.md",
        ] },
        { "Stash" = [
            "stash/index.md",
            "stash/git-stash.md",
            "stash/branch-and-stash.md",
        ] },
        { "Remotes" = [
            "remotes/index.md",
            "remotes/fetch-pull-push.md",
            "remotes/origin-and-upstream.md",
        ] },
        { "Undo and Recovery" = [
            "undo-recovery/index.md",
            "undo-recovery/restore-reset-revert.md",
            "undo-recovery/reflog.md",
        ] },
        { "Repository Practices" = [
            "repository/gitignore.md",
            "repository/tags.md",
            "repository/git-lfs.md",
        ] },
        { "Collaboration" = [
            "collaboration/conventional-commits.md",
            "collaboration/pull-requests.md",
        ] },
        { "Open Source" = [
            "opensrc-workflow/index.md",
        ] },
    ] },

    { "About" = "about.md" },
]

# Instant navigation feature for the theme
[project.theme]
logo = "images/logo.png"
favicon = "images/logo.png"
features = [
  # navigation
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  
  # table of contents
  "toc.follow",

  # Code block features
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",

  # content tabs
  "content.tabs.link",
]


# Palette toggle for automatic mode
[[project.theme.palette]]
primary = "custom"
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
primary = "custom"
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
primary = "custom"
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
homepage = "https://saqibbedar.github.io/gitcraft"

[project.plugins.tags]

[project.extra.tags]
Git = "git"
GitHub = "github"
Command = "command"
Guide = "guide"
Branch = "branch"
Stash = "stash"
Reference = "reference"
Remote = "remote"
Recovery = "recovery"
Repository = "repository"
Collaboration = "collaboration"
GitLFS = "git-lfs"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/saqibbedar"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/saqibbedar"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://linkedin.com/in/saqibbedar"

# Authoring configuration for the project
[project.extra.status]
new = "Recently added"
deprecated = "Deprecated"
[project.markdown_extensions]
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.slugify.object = "pymdownx.slugs.slugify"
pymdownx.tabbed.slugify.kwds.case = "lower"
admonition = {}
pymdownx.details = {}
tables = {}
footnotes = {}
pymdownx.caret = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.tilde = {}
attr_list = {}
md_in_html = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.blocks.caption = {}
def_list = {}
pymdownx.tasklist.custom_checkbox = true